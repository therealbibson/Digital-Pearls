<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital Pearls">
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.5" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#8f97a3"/>
    </linearGradient>
    <radialGradient id="pearlHi" cx="0.35" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6B25E"/>
      <stop offset="1" stop-color="#b8933f"/>
    </linearGradient>
  </defs>

  <!-- Pearl mark inside a gold ring -->
  <g transform="translate(4 4)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="15" fill="url(#pearl)"/>
    <circle cx="24" cy="24" r="15" fill="url(#pearlHi)"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" letter-spacing="0.5" fill="#0D234A">Digital Pearls</text>
  <text x="67" y="43" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.4" fill="#294F87">TECHNOLOGY ADVISORY</text>
</svg>
