<svg width="300" height="54" viewBox="0 0 300 54" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital Pearls — Technology Advisory">
  <defs>
    <!-- Pearl body: light at top-left, deeper silver at bottom-right so it stays visible on white -->
    <linearGradient id="pearl" x1="0.18" y1="0.12" x2="0.82" y2="0.92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#EDF1F6"/>
      <stop offset="1" stop-color="#B9C0CA"/>
    </linearGradient>
    <radialGradient id="pearlHi" cx="0.34" cy="0.30" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7CB80"/>
      <stop offset="0.5" stop-color="#D6B25E"/>
      <stop offset="1" stop-color="#B5903C"/>
    </linearGradient>
  </defs>

  <!-- Pearl mark inside a gold ring, vertically centered in the 54px canvas -->
  <g transform="translate(3 3)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#ring)" stroke-width="2.4"/>
    <circle cx="24" cy="24" r="15.5" fill="url(#pearl)" stroke="#C9CDD3" stroke-width="0.6"/>
    <circle cx="24" cy="24" r="15.5" fill="url(#pearlHi)"/>
    <circle cx="18.5" cy="18.5" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="30.5" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="0.2" fill="#0D234A">Digital Pearls</text>
  <text x="65" y="46.5" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.6" fill="#294F87">TECHNOLOGY ADVISORY</text>
</svg>
