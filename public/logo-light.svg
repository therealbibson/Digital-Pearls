<svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital Pearls">
  <defs>
    <linearGradient id="pearlW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.5" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#8f97a3"/>
    </linearGradient>
    <radialGradient id="pearlWHi" cx="0.35" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6B25E"/>
      <stop offset="1" stop-color="#b8933f"/>
    </linearGradient>
  </defs>
  <g transform="translate(2 4)">
    <circle cx="16" cy="16" r="15.5" fill="none" stroke="url(#ringW)" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="10" fill="url(#pearlW)"/>
    <circle cx="16" cy="16" r="10" fill="url(#pearlWHi)"/>
  </g>
  <text x="44" y="19" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" letter-spacing="0.4" fill="#FFFFFF">Digital Pearls</text>
  <text x="45" y="31" font-family="Inter, system-ui, sans-serif" font-size="6" font-weight="600" letter-spacing="2.6" fill="#C9CDD3">TECHNOLOGY ADVISORY</text>
